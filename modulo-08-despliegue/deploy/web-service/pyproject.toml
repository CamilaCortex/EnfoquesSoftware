[project]
name = "taxi-prediction-service"
version = "0.1.0"
description = "NYC Taxi Trip Duration Prediction Web Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.3",
    "flask>=2.3.0",
    "gunicorn>=23.0.0",
    "mlflow>=3.13.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "prometheus-client>=0.21.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "uvicorn>=0.49.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=22.0.0",
    "flake8>=5.0.0",
]
production = [
    "gunicorn>=20.1.0",
]
